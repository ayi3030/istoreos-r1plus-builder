name: Build iStoreOS for Orange Pi R1 Plus

# ─────────────────────────────────────────────────────────────
# 用 iStoreOS 官方 ImageBuilder 为 Xunlong Orange Pi R1 Plus 打包固件。
# 不编译源码，几分钟出包。
#
# 每月自动重建已启用：每月 1 号 UTC 03:17（北京时间 11:17）自动跑一次，
# 上游 iStoreOS ImageBuilder 更新后会自动跟着刷新。
# 注意：自动构建只会更新 Artifacts，不会自动刷进你的路由器。
# ─────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '17 3 1 * *'
  workflow_dispatch:
    inputs:
      profile:
        description: '设备 profile（R1 Plus 非 LTS；LTS 版网卡是 yt8531c，别选错）'
        required: true
        default: 'xunlong_orangepi-r1-plus'
        type: choice
        options:
          - xunlong_orangepi-r1-plus
          - xunlong_orangepi-r1-plus-lts
      lan_ip:
        description: '管理地址（你现在用 10.0.0.1；iStoreOS 默认是 192.168.100.1）'
        required: true
        default: '10.0.0.1'
      rootfs_partsize:
        description: 'rootfs 分区大小(MB)。64G 卡建议 4096；剩余空间刷完后另建第三分区挂 /mnt/data'
        required: true
        default: '4096'
      include_docker:
        description: '集成 Docker（1GB 内存请谨慎，见 README）'
        required: false
        default: false
        type: boolean
      with_gui_extras:
        description: '集成 iStore 商店 / quickstart 首页 / 磁盘管理 / argon 主题'
        required: false
        default: true
        type: boolean
      extra_packages:
        description: '额外软件包（空格分隔；写错包名会让构建失败）'
        required: false
        default: ''
      root_password:
        description: '可选。给固件预置 root 密码（会在 runner 内做 sha512 加盐，明文不出现在日志里）'
        required: false
        default: ''

permissions:
  contents: write

env:
  IB_BASE: https://fw.koolcenter.com/iStoreOS/ib/rk3xxx
  IB_FILE: istoreos-imagebuilder-rockchip-armv8.Linux-x86_64.tar.zst

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          df -h /

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev zlib1g-dev gawk git gettext \
            libssl-dev xsltproc rsync wget curl file unzip tar zstd xz-utils \
            python3 python3-setuptools openssl

      - name: Download official ImageBuilder + verify checksum
        working-directory: ${{ runner.temp }}
        run: |
          cd "$RUNNER_TEMP"
          echo "== 下载 $IB_FILE =="
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o "$IB_FILE" "$IB_BASE/$IB_FILE"
          curl -fL -o sha256sums "$IB_BASE/sha256sums"
          echo "== 官方 sha256sums 内容 =="
          cat sha256sums
          echo "== 校验 =="
          grep imagebuilder sha256sums | sha256sum -c -
          ls -lh "$IB_FILE"

      - name: Extract ImageBuilder
        run: |
          cd "$RUNNER_TEMP"
          tar --zstd -xf "$IB_FILE"
          IB_DIR=$(ls -d "$RUNNER_TEMP"/istoreos-imagebuilder-*/ | head -1)
          IB_DIR="${IB_DIR%/}"
          echo "IB_DIR=$IB_DIR" >> "$GITHUB_ENV"
          echo "解压到: $IB_DIR"
          echo "== IB 基础版本 =="
          cat "$IB_DIR/version.buildinfo" 2>/dev/null || true
          head -3 "$IB_DIR/repositories.conf" 2>/dev/null || true

      - name: Verify target profile exists (fail fast)
        run: |
          cd "$IB_DIR"
          make info > ib-info.txt 2>&1 || true
          echo "===== 目标 profile 检查：${{ inputs.profile }} ====="
          if grep -q "^${{ inputs.profile }}:" ib-info.txt; then
            grep -A3 "^${{ inputs.profile }}:" ib-info.txt
            echo "✅ profile 存在"
            grep -E "^(Current Target|Target|Subtarget):" ib-info.txt || true
          else
            echo "❌ 该 ImageBuilder 里没有 ${{ inputs.profile }}"
            echo "可用 profile 列表："
            grep -E "^[a-z0-9_-]+:" ib-info.txt | head -120
            exit 1
          fi

      - name: Provide bootloader blob (slice from official ImmortalWrt image)
        run: |
          IMGDIR=$(find "$IB_DIR/staging_dir" -type d -name image 2>/dev/null | head -1)
          echo "staging image dir: $IMGDIR"
          if [ -z "$IMGDIR" ]; then echo "❌ 找不到 staging image 目录"; exit 1; fi
          NEED="orangepi-r1-plus-rk3328-u-boot-rockchip.bin"
          echo "===== IB 自带的 u-boot 相关文件 ====="
          ls -1 "$IMGDIR" 2>/dev/null | grep -iE 'u-boot|loader|\.bin$' | head -40 || echo "(无)"
          if [ -f "$IMGDIR/$NEED" ]; then
            echo "✅ IB 自带 $NEED，无需补充"
            exit 0
          fi

          echo "⚠️ iStoreOS IB 未打包 R1 Plus 的设备级 bootloader"
          echo "方案：直接复用 ImmortalWrt 官方已发布固件里的 bootloader 区（该固件官方实测可启动）"
          echo "依据：iStoreOS 走 pine64-img(PARTOFFSET=16M)，ImmortalWrt 走 pine64-bin(align=32768 扇区)"
          echo "      两边首个分区都从 16MiB 开始 → bootloader 区同为 [扇区64=32KiB, 扇区32768=16MiB)"
          echo "      因此可整段搬运，不触碰分区表与内核分区"
          UP_VER="24.10.6"
          UP_URL="https://downloads.immortalwrt.org/releases/$UP_VER/targets/rockchip/armv8/immortalwrt-$UP_VER-rockchip-armv8-xunlong_orangepi-r1-plus-squashfs-sysupgrade.img.gz"
          echo "上游固件: $UP_URL"
          cd "$RUNNER_TEMP"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors -o up.img.gz "$UP_URL"
          ls -lh up.img.gz
          # 注意：OpenWrt 镜像尾部带 append-metadata，gunzip 会报 "trailing garbage"
          # 并返回退出码 2，在 set -e 下会误判为失败 —— 忽略退出码，改用大小校验兜底
          gunzip -c up.img.gz > up.img 2>/dev/null || true
          SZIMG=$(stat -c %s up.img)
          echo "解压后镜像: $SZIMG 字节"
          if [ "$SZIMG" -lt 16777216 ]; then echo "❌ 解压后镜像不足 16MiB，异常"; exit 1; fi
          echo "===== 上游官方镜像分区表（首个分区起点应为 32768 扇区 = 16MiB）====="
          fdisk -l up.img 2>/dev/null | head -20 || true
          sfdisk -d up.img 2>/dev/null | head -10 || true

          # 切片：扇区 64 ~ 32768，共 32704 扇区 = 16744448 字节
          OUT="$IMGDIR/$NEED"
          dd if=up.img of="$OUT" bs=512 skip=64 count=32704 status=none
          SZ=$(stat -c %s "$OUT")
          echo "切片大小: $SZ 字节（应为 16744448）"
          if [ "$SZ" -ne 16744448 ]; then echo "❌ 切片大小异常，停止构建"; exit 1; fi
          echo "===== 关键偏移内容（对应镜像内 32KiB / 8MiB / 12MiB 三处）====="
          for OFF in 0 8355840 12550144; do
            printf "  文件 offset %-9s : " "$OFF"
            od -An -tx1 -j "$OFF" -N 16 "$OUT" | tr -s ' ' | tr -d '\n'
            echo ""
          done
          # 三处都必须有内容（非全零），否则说明上游布局与预期不符
          for OFF in 0 8355840 12550144; do
            if od -An -tx1 -j "$OFF" -N 512 "$OUT" | tr -d ' \n' | grep -qE '[^0]'; then
              echo "  ✅ offset $OFF 有数据"
            else
              echo "  ❌ offset $OFF 全零（SPL/U-Boot/TRUST 缺失），停止构建"
              exit 1
            fi
          done
          echo "✅ 已从官方固件切片得到 $NEED（32KiB~16MiB 完整 bootloader 区）"

      - name: Compose package list
        id: pkgs
        run: |
          P=""
          if [ "${{ inputs.with_gui_extras }}" = "true" ]; then
            P="$P luci-app-store luci-app-quickstart luci-i18n-quickstart-zh-cn"
            P="$P luci-app-diskman luci-i18n-diskman-zh-cn"
            P="$P luci-theme-argon luci-i18n-argon-config-zh-cn luci-i18n-base-zh-cn"
          fi
          if [ "${{ inputs.include_docker }}" = "true" ]; then
            P="$P docker dockerd docker-compose luci-app-dockerman luci-i18n-dockerman-zh-cn"
          fi
          P="$P ${{ inputs.extra_packages }}"
          P=$(echo "$P" | tr -s ' ' | sed 's/^ *//;s/ *$//')
          echo "packages=$P" >> "$GITHUB_OUTPUT"
          echo "最终 PACKAGES: $P"

      - name: Prepare files overlay (LAN IP / root password / board network fix)
        run: |
          FILES="${{ github.workspace }}/files"
          mkdir -p "$FILES/etc/config" "$FILES/etc/uci-defaults"

          # ─────────────────────────────────────────────────────────────
          # 为什么必须手写网络配置？
          # iStoreOS 的 base-files/etc/board.d/02_network 里压根没有
          # xunlong,orangepi-r1-plus 这个 case（全文只认 nanopi-r2s / r4s / r4se），
          # 于是 R1 Plus 掉进 `*)` 兜底分支 → 只生成 LAN=eth0，**根本不生成 WAN**。
          #
          # ⚠️ 血的教训（v4 实测回归）：
          # 曾经为了"插哪个口都能进后台"，把 eth0+eth1 都桥接进 br-lan。
          # 结果光猫和电脑落在**同一个二层广播域**，光猫的 DHCP 直接应答了电脑，
          # 用户拿到的是上游光猫发的地址 —— 路由器完全没有路由该有的样子。
          # 结论：两个网口必须分工（WAN/LAN 分离），桥接在这里是错的。
          #
          # 物理对应（据 Orange Pi 官方手册接口图 + 实测资料）：
          #   eth0 = 原生 RTL8211E，**远离** Type-C 电源口的那个口 → WAN（接光猫）
          #   eth1 = USB  RTL8153B，**靠近** Type-C 电源口的那个口 → LAN（接电脑）
          # 板上有 "WAN LED" / "LAN LED" 丝印可直接对照。
          # ─────────────────────────────────────────────────────────────
          cat > "$FILES/etc/config/network" <<'EOF'
          config interface 'loopback'
          	option device 'lo'
          	option proto 'static'
          	option ipaddr '127.0.0.1'
          	option netmask '255.0.0.0'

          config globals 'globals'
          	option ula_prefix 'fdc7:c3f2:a41b::/48'
          	option packet_steering '1'

          # LAN：USB 网卡（靠近 Type-C 电源口的那个口）—— 接电脑
          config interface 'lan'
          	option device 'eth1'
          	option proto 'static'
          	option ipaddr '__LAN_IP__'
          	option netmask '255.255.255.0'
          	option ip6assign '60'

          # WAN：原生千兆网卡（远离 Type-C 电源口的那个口）—— 接光猫
          # 光猫在路由模式（有 DHCP 服务器）→ 直接 DHCP 拿地址，配好 NAT 即可上网
          config interface 'wan'
          	option device 'eth0'
          	option proto 'dhcp'
          EOF
          sed -i "s/__LAN_IP__/${{ inputs.lan_ip }}/" "$FILES/etc/config/network"

          # ─────────────────────────────────────────────────────────────
          # 防火墙 / DHCP：一律沿用 iStoreOS 系统自带的默认值，**不覆盖**。
          #
          # iStoreOS 的默认 firewall 本来就是标准双口路由器规则
          # （lan zone 含 lan、wan zone 含 wan 且 masq=1、forwarding lan→wan），
          # 默认 dhcp 也已经给 lan 配好了 server —— 只要我们按标准名字把
          # lan / wan 两个接口定义出来，这些默认规则就正好生效。
          # 自己覆盖反而会丢掉 iStoreOS 自带的那套规则，得不偿失。
          #
          # 这就是为什么上面只动了 /etc/config/network 一个文件：
          # 它不是"多余的定制"，而是补上 iStoreOS 源码里**确实缺失**的
          # R1 Plus 接口定义（02_network 里没有这个机型的 case）。
          # ─────────────────────────────────────────────────────────────

          # 注：这里**不再**覆盖 /etc/rc.local，也不再往 files 里塞任何
          # uci-defaults 自适应脚本 —— 保持固件与 iStoreOS 原版一致。
          # 唯一改动就是上面那份 /etc/config/network。
          #
          # 为什么删掉了之前的"网口自适应 + 网桥看门狗"：
          # 那套东西是为了"插哪个口都能进后台"而把两个网口桥接起来，
          # 结果把 WAN 侧和 LAN 侧并成了同一个二层域，光猫的 DHCP 直接
          # 应答了 LAN 上的电脑 —— 反而制造了故障。网口就该老老实实分工。

          if [ -n "${{ inputs.root_password }}" ]; then
            HASH=$(openssl passwd -6 "${{ inputs.root_password }}")
            cat > "$FILES/etc/shadow" <<EOF
          root:${HASH}:1:0:99999:7:::
          daemon:*:0:0:99999:7:::
          ftp:*:0:0:99999:7:::
          network:*:0:0:99999:7:::
          nobody:*:0:0:99999:7:::
          EOF
            chmod 600 "$FILES/etc/shadow"
            echo "已写入 root 密码哈希（明文不落盘、不进日志）"
          fi
          echo "== files 树 =="
          find "$FILES" -type f -exec echo {} \;

      - name: Build image
        run: |
          cd "$IB_DIR"
          make -j$(nproc) image \
            PROFILE="${{ inputs.profile }}" \
            PACKAGES="${{ steps.pkgs.outputs.packages }}" \
            FILES="${{ github.workspace }}/files" \
            ROOTFS_PARTSIZE="${{ inputs.rootfs_partsize }}" \
            CONFIG_TARGET_ROOTFS_PARTSIZE="${{ inputs.rootfs_partsize }}"

      - name: Collect artifacts
        run: |
          OUT="${{ github.workspace }}/out"
          BIN="$IB_DIR/bin/targets/rockchip/armv8"
          mkdir -p "$OUT"
          cp "$BIN"/*.img.gz "$OUT/" 2>/dev/null || true
          cp "$BIN"/*.manifest "$OUT/" 2>/dev/null || true
          cp "$BIN"/*config.buildinfo "$OUT/" 2>/dev/null || true
          cp "$BIN"/sha256sums "$OUT/" 2>/dev/null || true
          echo "===== 产物 ====="
          ls -lh "$OUT"
          (cd "$OUT" && sha256sum * 2>/dev/null | tee SHA256SUMS.txt)
          if [ -z "$(ls -A "$OUT")" ]; then
            echo "❌ 没有生成任何镜像"; exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-${{ inputs.profile }}-${{ github.run_number }}
          path: out/
          retention-days: 30
